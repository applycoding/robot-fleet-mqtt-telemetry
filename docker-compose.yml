services:
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "127.0.0.1", "-t", "healthcheck", "-m", "ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    init: true

  timescaledb:
    image: timescale/timescaledb:2.30.2-pg16
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
      POSTGRES_DB: fleet
    ports:
      - "5432:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./src/fleet_telemetry/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet"]
      interval: 5s
      timeout: 5s
      retries: 20
    init: true

  webhook:
    build: .
    image: fleet-telemetry:local
    command: fleet-webhook
    environment:
      WEBHOOK_PORT: "8080"
    ports:
      - "8080:8080"
    init: true

  ingestion:
    build: .
    image: fleet-telemetry:local
    command: fleet-ingest
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_TOPIC: fleet/telemetry/#
      DATABASE_URL: postgresql://fleet:fleet@timescaledb:5432/fleet
      WEBHOOK_URL: http://webhook:8080/alerts
      LOW_BATTERY_PERCENT: "20"
      CRITICAL_BATTERY_PERCENT: "10"
      STALE_AFTER_SECONDS: "15"
      STALE_CHECK_SECONDS: "2"
      ALERT_COOLDOWN_SECONDS: "60"
    depends_on:
      mosquitto:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      webhook:
        condition: service_started
    init: true

  simulator:
    build: .
    image: fleet-telemetry:local
    command: fleet-simulate
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      SCENARIO: demo
      PUBLISH_HZ: "1"
    depends_on:
      mosquitto:
        condition: service_healthy
    init: true

  api:
    build: .
    image: fleet-telemetry:local
    command: fleet-api
    environment:
      DATABASE_URL: postgresql://fleet:fleet@timescaledb:5432/fleet
      PORT: "8000"
      STALE_AFTER_SECONDS: "15"
    ports:
      - "8000:8000"
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    init: true

  grafana:
    image: grafana/grafana:11.5.2
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/fleet.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      timescaledb:
        condition: service_healthy

  ros-bridge:
    profiles: ["ros"]
    build:
      context: .
      dockerfile: Dockerfile.ros
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      ROBOT_ID: amr-ros
      DEMO_MOTION: "true"
    depends_on:
      mosquitto:
        condition: service_healthy
    init: true

volumes:
  timescale-data:
